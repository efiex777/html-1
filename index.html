<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de inscrição</title>
  <style>
    body { max-width: 500px; margin: 2rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
    form { display: grid; gap: 0.75rem; }
    input, select, button { padding: 0.6rem; font: inherit; }
    .terms { display: flex; gap: 0.5rem; align-items: center; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Formulário de inscrição</h1>
  </header>

  <main>
    <aside>
      <form action="" method="get">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" minlength="3" pattern="(?=(?:[^A-Za-zÀ-ÿ]*[A-Za-zÀ-ÿ]){3})[A-Za-zÀ-ÿ ]+" required autocomplete="name" title="Informe pelo menos 3 letras.">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="18" max="120" required>

        <label for="assunto">Assunto de interesse</label>
        <select id="assunto" name="assunto" required>
          <option value="">Selecione uma opção</option>
          <option value="literatura">Literatura</option>
          <option value="criatividade">Criatividade</option>
          <option value="cotidiano">Cotidiano</option>
        </select>

        <label class="terms" for="termos">
          <input type="checkbox" id="termos" name="termos" value="aceito" required>
          Aceito os termos
        </label>

        <button type="submit">Inscrever-se</button>
      </form>
    </aside>
  </main>
</body>
</html>
